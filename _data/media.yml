- id: publico-2025-07-02
  section: press-2025
  date: 2025-07-02
  type: prensa
  territory: nacional
  medium: Público
  meta_es: "Público · Tribunales · 02/07/2025 · Ana María Pascual"
  meta_en: "Público · Courts · 02/07/2025 · Ana María Pascual"
  title_es: "Una sentencia inédita devuelve la filiación biológica a un hombre adoptado a través de una trama de bebés robados"
  title_en: "An unprecedented ruling restores biological filiation to a man adopted through a stolen-babies network"
  subtitle_es: "La Audiencia de Pamplona ratifica una resolución que anula los efectos de una adopción de 1971 y ordena al Registro Civil que corrija la filiación de un hombre de 54 años, una vez que ha descubierto quiénes son sus progenitores biológicos. Su madre fue una de las mujeres que pasó su embarazo en los «pisos-cuna» de Mercedes de Gras, uno de los nombres clave del negocio de las adopciones irregulares en el franquismo."
  subtitle_en: "The Pamplona Court of Appeal confirms a ruling that annuls the effects of a 1971 adoption and orders the Civil Registry to correct the filiation of a 54-year-old man after he discovered the identity of his biological parents. His mother was one of the women who spent her pregnancy in the “maternity flats” run by Mercedes de Gras, one of the key names in the business of irregular adoptions during Francoism."
  original_url: "https://www.publico.es/politica/tribunales/sentencia-inedita-devuelve-filiacion-biologica-hombre-adoptado-traves-trama-bebes-robados.html"
  url: "https://web.archive.org/web/20250722164148/https://www.publico.es/politica/tribunales/sentencia-inedita-devuelve-filiacion-biologica-hombre-adoptado-traves-trama-bebes-robados.html"
