  section: press-2026
  date: 2026-08-07
  type: prensa
  territory: asturias
  medium: Asturias Laica
  meta_es: "Asturias Laica · Nota de prensa · 07/08/2026 · Olmo Gómez Aldaz"
  meta_en: "Asturias Laica · Press release · 07/08/2026 · Olmo Gómez Aldaz"
  title_es: "¿Está fracasando la Ley de Memoria Democrática con los bebés robados? | Olmo Gómez Aldaz"
  title_en: "Is the Democratic Memory Law failing stolen babies? | Olmo Gómez Aldaz"
  subtitle_es: "El Ministerio confirma que, desde 2022, solo ha reconocido la condición de víctima a un hijo sustraído sin el consentimiento libre y legítimo de sus progenitores."
  subtitle_en: "The Ministry confirms that, since 2022, it has recognised victim status for only one child abducted without the free and legitimate consent of their parents."
  url: "https://asturiaslaica.com/2026/08/07/esta-fracasando-la-ley-de-memoria-democratica-con-los-bebes-robados-olmo-gomez-aldaz/"
