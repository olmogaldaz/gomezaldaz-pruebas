- id: diario-red-2026-08-07
  section: press-2026
  date: 2026-08-07
  type: prensa
  territory: nacional
  medium: Diario Red
  meta_es: "Diario Red · Memoria democrática · 07/08/2026 · Sebas Fiorilli"
  meta_en: "Diario Red · Democratic Memory · 07/08/2026 · Sebas Fiorilli"
  title_es: "El Ministerio de Política Territorial y Memoria Democrática reconoce solo a Olmo Gómez Aldaz como hijo robado y víctima desde la aprobación de la Ley de Memoria Democrática"
  title_en: "The Ministry of Territorial Policy and Democratic Memory recognises only Olmo Gómez Aldaz as a stolen child and victim since the Democratic Memory Law was passed"
  subtitle_es: "Además del reconocimiento estatal, Gómez Aldaz ha sido recientemente reconocido como víctima por el Gobierno Vasco, al amparo de la Ley 9/2023 de Memoria Histórica y Democrática de Euskadi."
  subtitle_en: "In addition to the state recognition, Gómez Aldaz has recently been recognised as a victim by the Basque Government under Law 9/2023 on Historical and Democratic Memory of the Basque Country."
  url: "https://www.diario-red.com/articulo/memoria/ministerio-confirma-que-solo-ha-reconocido-hijo-robado-como-victima-aprobacion-ley-memoria-democratica/20260804163922073941.html"
