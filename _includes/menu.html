<style>
  @media (max-width: 768px) {
    #site-header .main-nav {
      position: absolute;
      top: 100%;
      right: 0;
      z-index: 1100;
      width: min(14rem, calc(100vw - 36px));
      margin-top: 8px;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .16);
    }
  }
</style>

<header id="site-header">
  <div class="site-title">
    <img src="/img/GA_512x512.png" alt="GA" class="logo-ga">
    <span>
      Olmo Gómez Aldaz{% if site.url contains "pruebas.gomezaldaz.com" %}<span style="color: #c62828;"> · PRUEBAS</span>{% endif %}
    </span>
  </div>

  {% if page.lang == "es" %}
    <button class="menu-toggle" aria-label="Menú">☰</button>
    <nav class="main-nav">
      <a href="/">Inicio</a>
      <a href="/es/autor/">Olmo</a>
      <a href="/es/memoria/">Memoria</a>
      <a href="/es/historia/">Historia</a>
      <a href="/es/demanda/">Demanda</a>
      <a href="/es/sentencia/">Sentencias</a>
      <a href="/es/obra/">Obra</a>
      <a href="/es/prensa/">Prensa</a>
      <div class="small">
        <strong>ES</strong> |
        <a href="{{ page.alt | default: '/en/' }}">EN</a>
      </div>
    </nav>
  {% else %}
    <button class="menu-toggle" aria-label="Menu">☰</button>
    <nav class="main-nav">
      <a href="/en/">Home</a>
      <a href="/en/author/">Olmo</a>
      <a href="/en/memory/">Memory</a>
      <a href="/en/story/">Story</a>
      <a href="/en/claim/">Claim</a>
      <a href="/en/sentence/">Judgments</a>
      <a href="/en/work/">Work</a>
      <a href="/en/press/">Press</a>
      <div class="small">
        <a href="{{ page.alt | default: '/' }}">ES</a> |
        <strong>EN</strong>
      </div>
    </nav>
  {% endif %}
</header>
