name: Separate WebPage schema nodes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: gem install jekyll --no-document
      - name: Add explicit WebPage nodes
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'

          excluded = %w[
            es/genus-homo/index.html
            en/genus-homo/index.html
            es/obra/adopcion/adopcion-genocidio-identicida-colonial/index.html
            en/work/adoption/adoption-as-colonial-identicide-genocide/index.html
            en/work/stolen-babies/maria-madre-association-report/index.html
            en/work/stolen-babies/adoptados-bilbao-report/index.html
            es/prensa/el-observatorio-9-2026/index.html
            en/press/el-observatorio-9-2026/index.html
          ]
          creative_types = %w[Book Article ScholarlyArticle Report]
          changed = []

          Dir.glob('**/index.html').sort.each do |path|
            next if path.start_with?('_site/') || excluded.include?(path)
            text = File.read(path)
            match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m)
            next unless match
            data = YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true) || {}
            nodes = data['schema_nodes']
            target_id = data['schema_date_target']
            next unless nodes.is_a?(Array) && target_id

            target = nodes.find { |node| node.is_a?(Hash) && node['@id'] == target_id }
            next unless target && creative_types.include?(target['@type'])

            canonical_path = data['canonical'] || data['url']
            next unless canonical_path
            canonical_url = "https://gomezaldaz.com#{canonical_path}"
            webpage_id = "#{canonical_url}#webpage"
            next if nodes.any? { |node| node.is_a?(Hash) && node['@id'] == webpage_id }

            webpage = {
              '@type' => 'WebPage',
              '@id' => webpage_id,
              'url' => canonical_url,
              'name' => data['title'],
              'description' => data['description'],
              'inLanguage' => data['lang'],
              'mainEntity' => { '@id' => target_id }
            }
            webpage.delete_if { |_key, value| value.nil? }

            target['mainEntityOfPage'] = { '@id' => webpage_id }
            nodes.insert(nodes.index(target), webpage)
            data['schema_nodes'] = nodes
            data['schema_date_target'] = webpage_id

            body = text[match.end(0)..] || ''
            yaml = YAML.dump(data, line_width: -1).sub(/\A---\s*\n/, '')
            File.write(path, "---\n#{yaml}---\n\n#{body.sub(/\A\n*/, '')}")
            changed << path
          end

          puts "CHANGED_COUNT=#{changed.size}"
          changed.each { |path| puts "CHANGED=#{path}" }
          abort 'No se encontró ninguna página afectada' if changed.empty?
          RUBY
      - name: Verify exclusions and visible bodies
        run: |
          ruby <<'RUBY'
          excluded = %w[
            es/genus-homo/index.html
            en/genus-homo/index.html
            es/obra/adopcion/adopcion-genocidio-identicida-colonial/index.html
            en/work/adoption/adoption-as-colonial-identicide-genocide/index.html
            en/work/stolen-babies/maria-madre-association-report/index.html
            en/work/stolen-babies/adoptados-bilbao-report/index.html
            es/prensa/el-observatorio-9-2026/index.html
            en/press/el-observatorio-9-2026/index.html
          ]
          errors = []
          excluded.each do |path|
            errors << "Se modificó una página excluida: #{path}" unless `git diff --name-only HEAD -- #{path}`.strip.empty?
          end
          `git diff --name-only -- '**/index.html'`.lines.map(&:strip).reject(&:empty?).each do |path|
            current = File.read(path).sub(/\A---\s*\n.*?\n---\s*\n/m, '')
            previous = `git show HEAD:#{path}`.sub(/\A---\s*\n.*?\n---\s*\n/m, '')
            errors << "Cambió el cuerpo visible: #{path}" unless current == previous
          end
          puts "VERIFY_ERRORS=#{errors.size}"
          errors.each { |error| puts error }
          exit 1 unless errors.empty?
          RUBY
      - name: Build and validate JSON-LD
        run: |
          jekyll build --trace
          ruby <<'RUBY'
          require 'yaml'
          require 'json'
          require 'date'
          errors = []
          changed = `git diff --name-only -- '**/index.html'`.lines.map(&:strip).reject(&:empty?)
          changed.each do |path|
            source = File.read(path)
            fm = source.match(/\A---\s*\n(.*?)\n---\s*\n/m)
            data = YAML.safe_load(fm[1], permitted_classes: [Date, Time], aliases: true)
            target_id = data['schema_date_target']
            canonical_path = data['canonical'] || data['url']
            output = canonical_path == '/' ? '_site/index.html' : File.join('_site', canonical_path.sub(%r{^/}, ''), 'index.html')
            script = File.read(output).match(/<script type="application\/ld\+json">(.*?)<\/script>/m)&.[](1)
            begin
              json = JSON.parse(script)
              nodes = json['@graph']
            rescue => e
              errors << "JSON-LD inválido en #{path}: #{e.message}"
              next
            end
            webpage = nodes.find { |node| node.is_a?(Hash) && node['@id'] == target_id }
            unless webpage && webpage['@type'] == 'WebPage'
              errors << "El objetivo no es WebPage en #{path}"
              next
            end
            entity_id = webpage.dig('mainEntity', '@id')
            entity = nodes.find { |node| node.is_a?(Hash) && node['@id'] == entity_id }
            errors << "Falta mainEntityOfPage en #{path}" unless entity&.dig('mainEntityOfPage', '@id') == target_id
          end
          puts "JSONLD_ERRORS=#{errors.size}"
          errors.each { |error| puts error }
          exit 1 unless errors.empty?
          RUBY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/separate-webpage-schema.yml
          git add -- ':(glob)**/index.html'
          git commit -m 'Separate WebPage schema from creative works'
          git push origin HEAD:main
