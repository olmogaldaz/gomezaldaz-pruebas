name: Add 28 July PDF to Memory pages

# One-time workflow for the test repository.
on:
  push:
    paths:
      - '.github/workflows/add-memory-foi-pdf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add PDF links to Spanish and English Memory pages
        shell: python
        run: |
          from pathlib import Path

          changes = {
            Path('es/memoria/index.html'): [
              (
                '''      <p>
        El 28 de julio de 2026, la Dirección General de Atención a las Víctimas confirmó mediante una resolución de acceso a la información pública que la declaración estatal era también la única concedida a una persona sustraída, separada o entregada al nacer sin el consentimiento libre y legítimo de sus progenitores.
      </p>

      <p>
        <a href="/es/prensa/el-correo-primer-bebe-robado-victima-franquismo/">Consultar la cobertura y documentación de <em>El Correo</em></a>
      </p>''',
                '''      <p>
        El 28 de julio de 2026, la Dirección General de Atención a las Víctimas confirmó mediante una resolución de acceso a la información pública que la declaración estatal era también la única concedida a una persona sustraída, separada o entregada al nacer sin el consentimiento libre y legítimo de sus progenitores.
      </p>

      <p class="card-cta">
        <a class="cta"
           href="/docs/resolucion-acceso-informacion-unica-declaracion-reconocimiento-olmo-2026.pdf"
           target="_blank"
           rel="noopener noreferrer">
          Resolución de acceso a la información pública de 28 de julio de 2026 (PDF)
        </a>
      </p>

      <p>
        <a href="/es/prensa/el-correo-primer-bebe-robado-victima-franquismo/">Consultar la cobertura y documentación de <em>El Correo</em></a>
      </p>'''
              ),
              (
                '''      <p class="card-cta">
        <a class="cta"
           href="/docs/resolucion-gogora-reconocimiento-victima-franquismo-olmo-gomez-aldaz-2026.pdf"
           target="_blank"
           rel="noopener">
          Resolución de reconocimiento de Gogora (PDF)
        </a>
      </p>

      <p class="back-top">''',
                '''      <p class="card-cta">
        <a class="cta"
           href="/docs/resolucion-gogora-reconocimiento-victima-franquismo-olmo-gomez-aldaz-2026.pdf"
           target="_blank"
           rel="noopener">
          Resolución de reconocimiento de Gogora (PDF)
        </a>
      </p>

      <p>
        Resolución de acceso a la información pública de 28 de julio de 2026 que confirma el carácter único de la declaración estatal concedida a una persona sustraída, separada o entregada al nacer sin el consentimiento libre y legítimo de sus progenitores.
      </p>

      <p class="card-cta">
        <a class="cta"
           href="/docs/resolucion-acceso-informacion-unica-declaracion-reconocimiento-olmo-2026.pdf"
           target="_blank"
           rel="noopener noreferrer">
          Resolución de acceso a la información pública (PDF)
        </a>
      </p>

      <p class="back-top">'''
              )
            ],
            Path('en/memory/index.html'): [
              (
                '''      <p>
        On 28 July 2026, the Directorate-General for Victim Support also confirmed, through a public-information access decision, that the state declaration was the only one granted to a person removed, separated or handed over at birth without the free and legitimate consent of their parents.
      </p>

      <p>
        <a href="/en/press/el-correo-first-stolen-baby-recognised-francoism-victim/">View the <em>El Correo</em> coverage and documentary page</a>
      </p>''',
                '''      <p>
        On 28 July 2026, the Directorate-General for Victim Support also confirmed, through a public-information access decision, that the state declaration was the only one granted to a person removed, separated or handed over at birth without the free and legitimate consent of their parents.
      </p>

      <p class="card-cta">
        <a class="cta"
           href="/docs/resolucion-acceso-informacion-unica-declaracion-reconocimiento-olmo-2026.pdf"
           target="_blank"
           rel="noopener noreferrer">
          Public-information access decision of 28 July 2026 (PDF)
        </a>
      </p>

      <p>
        <a href="/en/press/el-correo-first-stolen-baby-recognised-francoism-victim/">View the <em>El Correo</em> coverage and documentary page</a>
      </p>'''
              ),
              (
                '''      <p class="card-cta">
        <a class="cta"
           href="/docs/resolucion-gogora-reconocimiento-victima-franquismo-olmo-gomez-aldaz-2026.pdf"
           target="_blank"
           rel="noopener">
          Gogora recognition resolution (PDF)
        </a>
      </p>

      <p class="back-top">''',
                '''      <p class="card-cta">
        <a class="cta"
           href="/docs/resolucion-gogora-reconocimiento-victima-franquismo-olmo-gomez-aldaz-2026.pdf"
           target="_blank"
           rel="noopener">
          Gogora recognition resolution (PDF)
        </a>
      </p>

      <p>
        Public-information access decision of 28 July 2026 confirming that the state declaration was the only one granted to a person removed, separated or handed over at birth without the free and legitimate consent of their parents.
      </p>

      <p class="card-cta">
        <a class="cta"
           href="/docs/resolucion-acceso-informacion-unica-declaracion-reconocimiento-olmo-2026.pdf"
           target="_blank"
           rel="noopener noreferrer">
          Public-information access decision (PDF)
        </a>
      </p>

      <p class="back-top">'''
              )
            ]
          }

          changed = []
          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if new in text:
                      continue
                  if old not in text:
                      raise SystemExit(f'Expected block not found in {path}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/memoria/index.html en/memory/index.html
          git commit -m "Añadir PDF del 28 de julio a las páginas de Memoria"
          git push
