name: Run schema date tools
on:
  push:
    branches:
      - schema-fechas-resources
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-fechas-resources
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: gem install jekyll --no-document
      - run: ruby tools/apply_schema_dates.rb
      - run: jekyll build --trace
      - run: ruby tools/validate_schema_dates.rb
      - name: Verify visible content
        run: |
          ruby -ryaml -e 'YAML.load_file("_data/resources.yml").fetch("html").each{|r|u=r.fetch("url");p=u=="/" ? "index.html" : File.join(u.sub(%r{^/},"").sub(%r{/$},""),"index.html");c=File.read(p).sub(/\A---\s*\n.*?\n---\s*\n/m,"");o=`git show 1d4280d001594722b26ebd5479d608cf781de6d8:#{p}`.sub(/\A---\s*\n.*?\n---\s*\n/m,"");abort("visible body changed: #{p}") unless c==o};puts "VISIBLE_BODY_DIFFERENCES=0"'
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-schema-resource-dates.yml .github/workflows/apply-schema-resource-dates-final.yml .github/workflows/run-schema-date-tools.yml tools/apply_schema_dates.rb tools/validate_schema_dates.rb
          git add _layouts/default.html
          git add -- ':(glob)**/index.html'
          git commit -m 'Apply resource dates to page schema nodes'
          git push origin HEAD:schema-fechas-resources
