name: Add Genus Homo WebPage nodes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: gem install jekyll --no-document
      - name: Add explicit WebPage nodes
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'

          pages = {
            'es/genus-homo/index.html' => {
              'url' => 'https://gomezaldaz.com/es/genus-homo/',
              'title' => 'Editorial Genus Homo · Caso Olmo Gómez Aldaz',
              'description' => 'Sello editorial independiente vinculado a los proyectos de identidad, memoria y restitución.',
              'lang' => 'es'
            },
            'en/genus-homo/index.html' => {
              'url' => 'https://gomezaldaz.com/en/genus-homo/',
              'title' => 'Genus Homo Publishing · Olmo Gómez Aldaz',
              'description' => 'Independent publishing imprint linked to projects of identity, memory and restitution.',
              'lang' => 'en'
            }
          }

          pages.each do |path, meta|
            text = File.read(path)
            match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m) or abort "Front matter missing: #{path}"
            data = YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true) || {}
            nodes = data['schema_nodes']
            abort "schema_nodes invalid: #{path}" unless nodes.is_a?(Array)
            organization = nodes.find { |node| node.is_a?(Hash) && node['@type'] == 'Organization' }
            abort "Organization missing: #{path}" unless organization
            webpage_id = "#{meta['url']}#webpage"
            abort "WebPage already exists: #{path}" if nodes.any? { |node| node.is_a?(Hash) && node['@id'] == webpage_id }

            organization.delete('@context')
            organization['mainEntityOfPage'] = { '@id' => webpage_id }
            webpage = {
              '@type' => 'WebPage',
              '@id' => webpage_id,
              'url' => meta['url'],
              'name' => meta['title'],
              'description' => meta['description'],
              'inLanguage' => meta['lang'],
              'mainEntity' => { '@id' => organization['@id'] }
            }
            data['schema_nodes'] = [webpage, organization]
            data['schema_date_target'] = webpage_id

            body = text[match.end(0)..] || ''
            yaml = YAML.dump(data, line_width: -1).sub(/\A---\s*\n/, '')
            File.write(path, "---\n#{yaml}---\n\n#{body.sub(/\A\n*/, '')}")
          end
          RUBY
      - name: Verify and build
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'
          paths = %w[es/genus-homo/index.html en/genus-homo/index.html]
          paths.each do |path|
            current = File.read(path)
            previous = `git show HEAD:#{path}`
            current_body = current.sub(/\A---\s*\n.*?\n---\s*\n/m, '')
            previous_body = previous.sub(/\A---\s*\n.*?\n---\s*\n/m, '')
            abort "Visible body changed: #{path}" unless current_body == previous_body
            fm = current.match(/\A---\s*\n(.*?)\n---\s*\n/m)
            data = YAML.safe_load(fm[1], permitted_classes: [Date, Time], aliases: true)
            nodes = data['schema_nodes']
            webpage = nodes.find { |n| n['@type'] == 'WebPage' }
            org = nodes.find { |n| n['@type'] == 'Organization' }
            abort "Missing nodes: #{path}" unless webpage && org
            abort "Bad mainEntity: #{path}" unless webpage.dig('mainEntity', '@id') == org['@id']
            abort "Bad mainEntityOfPage: #{path}" unless org.dig('mainEntityOfPage', '@id') == webpage['@id']
            abort "Bad date target: #{path}" unless data['schema_date_target'] == webpage['@id']
          end
          RUBY
          jekyll build --trace
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-genus-homo-webpages.yml
          git add es/genus-homo/index.html en/genus-homo/index.html
          git commit -m 'Add WebPage schema to Genus Homo pages'
          git push origin HEAD:main
