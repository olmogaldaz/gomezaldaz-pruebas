name: Remove Book mainEntityOfPage

on:
  push:
    paths:
      - '.github/workflows/remove-book-main-entity-of-page.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove inverse Book links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              Path('es/obra/libros/index.html'): 'https://gomezaldaz.com/es/obra/libros/#webpage',
              Path('en/work/books/index.html'): 'https://gomezaldaz.com/en/work/books/#webpage',
          }

          for path, webpage_id in files.items():
              text = path.read_text(encoding='utf-8')
              block = f'  mainEntityOfPage:\n    "@id": {webpage_id}\n'
              if text.count(block) != 1:
                  raise SystemExit(f'{path}: expected one mainEntityOfPage block, found {text.count(block)}')
              text = text.replace(block, '', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Build site
        run: jekyll build --trace

      - name: Validate generated Book schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          cases = [
              ('_site/es/obra/libros/index.html',
               'https://gomezaldaz.com/es/obra/libros/#webpage',
               'https://gomezaldaz.com/es/obra/libros/#publication'),
              ('_site/en/work/books/index.html',
               'https://gomezaldaz.com/en/work/books/#webpage',
               'https://gomezaldaz.com/en/work/books/#publication'),
          ]

          def graph(path):
              text = Path(path).read_text(encoding='utf-8')
              match = re.search(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>', text, re.S)
              if not match:
                  raise SystemExit(f'{path}: JSON-LD not found')
              return json.loads(match.group(1))['@graph']

          website_id = 'https://gomezaldaz.com/#website'

          for path, webpage_id, book_id in cases:
              nodes = graph(path)
              webpage = next((n for n in nodes if n.get('@id') == webpage_id), None)
              book = next((n for n in nodes if n.get('@id') == book_id), None)
              if not webpage or webpage.get('@type') != 'WebPage':
                  raise SystemExit(f'{path}: WebPage missing')
              if webpage.get('mainEntity', {}).get('@id') != book_id:
                  raise SystemExit(f'{path}: WebPage.mainEntity changed or missing')
              if webpage.get('isPartOf', {}).get('@id') != website_id:
                  raise SystemExit(f'{path}: WebPage.isPartOf changed or missing')
              if not book or book.get('@type') != 'Book':
                  raise SystemExit(f'{path}: Book missing')
              if 'mainEntityOfPage' in book:
                  raise SystemExit(f'{path}: Book still contains mainEntityOfPage')
              websites = [n for n in nodes if n.get('@type') == 'WebSite' and n.get('@id') == website_id]
              if len(websites) != 1:
                  raise SystemExit(f'{path}: expected one WebSite, found {len(websites)}')

          print('Validated: Book.mainEntityOfPage removed; WebPage.mainEntity and WebSite links preserved.')
          PY

      - name: Commit validated change and remove workflow
        run: |
          rm .github/workflows/remove-book-main-entity-of-page.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add es/obra/libros/index.html en/work/books/index.html .github/workflows/remove-book-main-entity-of-page.yml
          git commit -m 'Remove inverse page links from Book schema'
          git push
