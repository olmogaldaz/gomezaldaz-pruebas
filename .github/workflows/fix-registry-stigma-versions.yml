name: One-time registry stigma correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-registry-stigma-versions.yml
      - .github/scripts/fix_registry_stigma_versions.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Spanish and English publication pages
        run: python3 .github/scripts/fix_registry_stigma_versions.py

      - name: Commit correction
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/obra/adopcion/estigma-registral-adopcion/index.html \
                  en/work/adoption/registry-stigma-of-adoption/index.html \
                  .github/workflows/fix-registry-stigma-versions.yml \
                  .github/scripts/fix_registry_stigma_versions.py
          git commit -m "Correct registry stigma Spanish and English editions"
          git push
