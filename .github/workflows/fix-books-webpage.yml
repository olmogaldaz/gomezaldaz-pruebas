name: Fix Books WebPage schema

on:
  push:
    paths:
      - '.github/workflows/fix-books-webpage.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: gem install jekyll --no-document
      - name: Update books schemas
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'

          pages = {
            'es/obra/libros/index.html' => {
              'url' => 'https://gomezaldaz.com/es/obra/libros/',
              'id' => 'https://gomezaldaz.com/es/obra/libros/#webpage',
              'lang' => 'es'
            },
            'en/work/books/index.html' => {
              'url' => 'https://gomezaldaz.com/en/work/books/',
              'id' => 'https://gomezaldaz.com/en/work/books/#webpage',
              'lang' => 'en'
            }
          }

          pages.each do |path, info|
            text = File.read(path)
            match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m)
            abort "No front matter: #{path}" unless match
            data = YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true) || {}
            body = text[match.end(0)..] || ''
            nodes = data.fetch('schema_nodes')
            book = nodes.find { |n| n.is_a?(Hash) && n['@type'] == 'Book' && n['@id']&.end_with?('#publication') }
            abort "Book not found: #{path}" unless book
            book_id = book['@id']
            webpage = {
              '@type' => 'WebPage',
              '@id' => info['id'],
              'url' => info['url'],
              'name' => data['title'],
              'description' => data['description'],
              'inLanguage' => info['lang'],
              'mainEntity' => { '@id' => book_id },
              'isPartOf' => { '@id' => 'https://gomezaldaz.com/#website' }
            }
            book['mainEntityOfPage'] = { '@id' => info['id'] }
            nodes.reject! { |n| n.is_a?(Hash) && n['@id'] == info['id'] }
            nodes.unshift(webpage)
            data['schema_nodes'] = nodes
            data['schema_date_target'] = info['id']
            yaml = YAML.dump(data, line_width: -1).sub(/\A---\s*\n/, '')
            File.write(path, "---\n#{yaml}---\n\n#{body.sub(/\A\n*/, '')}")
          end
          RUBY
      - name: Verify and build
        run: |
          ruby -e "require 'yaml'; require 'date'; %w[es/obra/libros/index.html en/work/books/index.html].each{|p| t=File.read(p); m=t.match(/\A---\s*\n(.*?)\n---\s*\n/m); d=YAML.safe_load(m[1], permitted_classes:[Date,Time], aliases:true); abort p unless d['schema_date_target']&.end_with?('#webpage') && d['schema_nodes'].any?{|n| n['@type']=='WebPage'} && d['schema_nodes'].any?{|n| n['@type']=='Book' && n['mainEntityOfPage']}}"
          jekyll build --trace
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-books-webpage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add es/obra/libros/index.html en/work/books/index.html .github/workflows/fix-books-webpage.yml
          git commit -m 'Add WebPage schema to books pages'
          git push
