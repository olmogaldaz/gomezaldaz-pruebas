name: Audit schema page relationships

on:
  push:
    paths:
      - '.github/workflows/audit-schema-page-relationships.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit indexed HTML schema relationships
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'json'

          WEBSITE_ID = 'https://gomezaldaz.com/#website'

          def source_path(url)
            return 'index.html' if url == '/'
            "#{url.sub(%r{\A/}, '')}index.html"
          end

          def front_matter(path)
            text = File.read(path, encoding: 'UTF-8')
            match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m)
            raise "No front matter in #{path}" unless match
            [YAML.unsafe_load(match[1]) || {}, text]
          end

          resources = YAML.unsafe_load_file('_data/resources.yml').fetch('html')
          report = []

          resources.each do |resource|
            url = resource.fetch('url')
            path = source_path(url)
            raise "Missing source file for #{url}: #{path}" unless File.file?(path)

            data, = front_matter(path)
            nodes = Array(data['schema_nodes'])
            webpages = nodes.select { |node| node.is_a?(Hash) && node['@type'] == 'WebPage' }
            website_refs = webpages.select do |node|
              part = node['isPartOf']
              part.is_a?(Hash) && part['@id'] == WEBSITE_ID
            end
            inverse_nodes = nodes.select do |node|
              node.is_a?(Hash) && node.key?('mainEntityOfPage')
            end
            target_id = data['schema_date_target']
            target_node = nodes.find { |node| node.is_a?(Hash) && node['@id'] == target_id }

            report << {
              url: url,
              path: path,
              schema_node_types: nodes.map { |node| node.is_a?(Hash) ? node['@type'] : nil }.compact,
              webpage_count: webpages.length,
              webpage_ids: webpages.map { |node| node['@id'] },
              website_reference_count: website_refs.length,
              inverse_node_types: inverse_nodes.map { |node| node['@type'] },
              inverse_node_ids: inverse_nodes.map { |node| node['@id'] },
              schema_date_target: target_id,
              schema_date_target_type: target_node && target_node['@type']
            }
          end

          summary = {
            indexed_html: report.length,
            exactly_one_webpage: report.count { |item| item[:webpage_count] == 1 },
            no_webpage: report.count { |item| item[:webpage_count] == 0 },
            multiple_webpages: report.count { |item| item[:webpage_count] > 1 },
            webpage_already_linked_to_website: report.count { |item| item[:website_reference_count] == 1 },
            webpage_missing_website_link: report.count { |item| item[:webpage_count] == 1 && item[:website_reference_count] == 0 },
            pages_with_inverse_main_entity_of_page: report.count { |item| !item[:inverse_node_ids].empty? }
          }

          puts "SCHEMA_AUDIT_SUMMARY=#{JSON.generate(summary)}"
          puts 'SCHEMA_AUDIT_DETAILS_BEGIN'
          report.each { |item| puts JSON.generate(item) }
          puts 'SCHEMA_AUDIT_DETAILS_END'

          File.write('/tmp/schema-audit.json', JSON.pretty_generate({summary: summary, pages: report}))
          RUBY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: schema-page-relationship-audit
          path: /tmp/schema-audit.json

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/audit-schema-page-relationships.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-schema-page-relationships.yml
          git commit -m 'Remove temporary schema relationship audit'
          git push
