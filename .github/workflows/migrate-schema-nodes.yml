name: One-time schema_nodes migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-schema-nodes.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run migration
        run: python3 .github/scripts/migrate_schema_nodes.py

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize page-specific schema in front matter"
          git push
