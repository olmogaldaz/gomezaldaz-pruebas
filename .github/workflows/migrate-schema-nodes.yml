name: One-time schema_nodes migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-schema-nodes.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate page-specific schema to front matter
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          LAYOUT = ROOT / '_layouts/default.html'
          WORKFLOW = ROOT / '.github/workflows/migrate-schema-nodes.yml'

          def split_front_matter(path):
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise AssertionError(f'No front matter: {path}')
              end = text.find('\n---\n', 4)
              if end < 0:
                  raise AssertionError(f'Unclosed front matter: {path}')
              front = text[4:end]
              body = text[end + 5:]
              return text, front, body

          def write_front(path, front, body):
              path.write_text('---\n' + front.rstrip('\n') + '\n---\n' + body, encoding='utf-8')

          # 1) Inventory and migrate every existing schema_publication block.
          publication_pages = []
          original_bodies = {}
          for path in sorted(ROOT.rglob('*.html')):
              if any(part in {'.git', '_site'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if 'schema_publication:' not in text:
                  continue
              _, front, body = split_front_matter(path)
              if front.count('schema_publication:') != 1:
                  raise AssertionError(f'Unexpected schema_publication count: {path}')
              if 'schema_nodes:' in front:
                  raise AssertionError(f'Already has schema_nodes: {path}')
              lines = front.splitlines()
              idx = lines.index('schema_publication:')
              children = lines[idx + 1:]
              if not children:
                  raise AssertionError(f'Empty schema_publication: {path}')
              converted = ['schema_nodes:']
              first = children[0]
              if not first.startswith('  '):
                  raise AssertionError(f'Bad schema indentation: {path}')
              converted.append('  - ' + first[2:])
              converted.extend('  ' + line for line in children[1:])
              new_front = '\n'.join(lines[:idx] + converted)
              original_bodies[path] = body
              write_front(path, new_front, body)
              publication_pages.append(path)

          if len(publication_pages) != 14:
              raise AssertionError(f'Expected 14 publication pages, found {len(publication_pages)}: {publication_pages}')

          # 2) Move the URL-conditional nodes from the layout into the ten pages themselves.
          page_nodes = {
              'es/autor/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": ProfilePage
    "@id": "https://gomezaldaz.com/es/autor/#profilepage"
    url: "https://gomezaldaz.com/es/autor/"
    name: "Perfil de Olmo Gómez Aldaz"
    description: "{{ page.description }}"
    inLanguage: es
    mainEntity:
      "@id": "https://gomezaldaz.com/#person"''',
              'en/author/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": ProfilePage
    "@id": "https://gomezaldaz.com/en/author/#profilepage"
    url: "https://gomezaldaz.com/en/author/"
    name: "Profile of Olmo Gómez Aldaz"
    description: "{{ page.description }}"
    inLanguage: en
    mainEntity:
      "@id": "https://gomezaldaz.com/#person"''',
              'index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": WebSite
    "@id": "https://gomezaldaz.com/#website"
    url: "https://gomezaldaz.com/"
    name: "Olmo Gómez Aldaz"
    inLanguage:
      - es
      - en
    about:
      "@id": "https://gomezaldaz.com/#person"
  - "@context": "https://schema.org"
    "@type": WebPage
    "@id": "https://gomezaldaz.com/#webpage"
    url: "https://gomezaldaz.com/"
    name: "Olmo Gómez Aldaz: el hombre que no pudieron borrar"
    description: "{{ page.description }}"
    inLanguage: es
    isPartOf:
      "@id": "https://gomezaldaz.com/#website"
    mainEntity:
      "@id": "https://gomezaldaz.com/#person"''',
              'en/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": WebSite
    "@id": "https://gomezaldaz.com/#website"
    url: "https://gomezaldaz.com/"
    name: "Olmo Gómez Aldaz"
    inLanguage:
      - es
      - en
    about:
      "@id": "https://gomezaldaz.com/#person"
  - "@context": "https://schema.org"
    "@type": WebPage
    "@id": "https://gomezaldaz.com/en/#webpage"
    url: "https://gomezaldaz.com/en/"
    name: "Olmo Gómez Aldaz: The Man They Could Not Erase"
    description: "{{ page.description }}"
    inLanguage: en
    isPartOf:
      "@id": "https://gomezaldaz.com/#website"
    mainEntity:
      "@id": "https://gomezaldaz.com/#person"''',
              'es/genus-homo/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": Organization
    "@id": "https://gomezaldaz.com/#genus-homo"
    name: "Genus Homo"
    url: "https://gomezaldaz.com/es/genus-homo/"
    description: "Genus Homo es una editorial independiente fundada por Olmo Gómez Aldaz para la edición y publicación de sus obras."
    logo: "https://gomezaldaz.com/img/genus-homo.jpg"
    foundingDate: "2025"
    founder:
      "@id": "https://gomezaldaz.com/#person"''',
              'en/genus-homo/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": Organization
    "@id": "https://gomezaldaz.com/#genus-homo"
    name: "Genus Homo"
    url: "https://gomezaldaz.com/en/genus-homo/"
    description: "Genus Homo is an independent publishing imprint founded by Olmo Gómez Aldaz for the edition and publication of his works."
    logo: "https://gomezaldaz.com/img/genus-homo.jpg"
    foundingDate: "2025"
    founder:
      "@id": "https://gomezaldaz.com/#person"''',
              'es/demanda/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": Article
    "@id": "https://gomezaldaz.com/#legal-case"
    headline: "Procedimiento judicial sobre filiación biológica y nulidad de adopción"
    description: "Procedimiento judicial en el que se ejercitaron conjuntamente la acción de reclamación de filiación biológica y la acción de nulidad de adopción, con solicitud de la correspondiente rectificación registral."
    url: "https://gomezaldaz.com/es/demanda/"
    author:
      "@id": "https://gomezaldaz.com/#person"
    about:
      "@id": "https://gomezaldaz.com/#person"
    mainEntityOfPage: "https://gomezaldaz.com/es/demanda/"
    inLanguage: es''',
              'en/claim/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": Article
    "@id": "https://gomezaldaz.com/#legal-case"
    headline: "Judicial procedure concerning biological filiation and nullity of adoption"
    description: "Judicial proceeding in which an action for the determination of biological filiation and an action for nullity of adoption were jointly exercised, seeking the corresponding rectification of civil registry records."
    url: "https://gomezaldaz.com/en/claim/"
    author:
      "@id": "https://gomezaldaz.com/#person"
    about:
      "@id": "https://gomezaldaz.com/#person"
    mainEntityOfPage: "https://gomezaldaz.com/en/claim/"
    inLanguage: en''',
              'es/sentencia/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": Article
    "@id": "https://gomezaldaz.com/#legal-case"
    headline: "Procedimiento judicial sobre filiación biológica y nulidad de adopción"
    description: "Procedimiento judicial en el que se ejercitaron conjuntamente la acción de reclamación de filiación biológica y la acción de nulidad de adopción, con solicitud de la correspondiente rectificación registral."
    url: "https://gomezaldaz.com/es/sentencia/"
    author:
      "@id": "https://gomezaldaz.com/#person"
    about:
      "@id": "https://gomezaldaz.com/#person"
    mainEntityOfPage: "https://gomezaldaz.com/es/sentencia/"
    inLanguage: es
  - "@context": "https://schema.org"
    "@type": Article
    "@id": "https://gomezaldaz.com/#court-decision"
    headline: "Sentencia judicial que reconoce la doble filiación a una persona adoptada"
    description: "Resolución judicial firme que declara la filiación biológica del demandante sin anular la adopción previa, estableciendo una situación de doble filiación con plenos efectos civiles y registrales. La decisión fue posteriormente confirmada íntegramente por la Audiencia Provincial de Navarra. Por su contenido y alcance, constituye una resolución pionera a nivel mundial y abre la vía para que otras personas adoptadas puedan ejercitar acciones similares de reconocimiento de doble filiación."
    url: "https://gomezaldaz.com/es/sentencia/"
    author:
      "@id": "https://gomezaldaz.com/#person"
    about:
      - "@id": "https://gomezaldaz.com/#person"
      - "@id": "https://gomezaldaz.com/#legal-case"
    mainEntityOfPage: "https://gomezaldaz.com/es/sentencia/"
    inLanguage: es''',
              'en/sentence/index.html': '''schema_nodes:
  - "@context": "https://schema.org"
    "@type": Article
    "@id": "https://gomezaldaz.com/#legal-case"
    headline: "Judicial procedure concerning biological filiation and nullity of adoption"
    description: "Judicial proceeding in which an action for the determination of biological filiation and an action for nullity of adoption were jointly exercised, seeking the corresponding rectification of civil registry records."
    url: "https://gomezaldaz.com/en/sentence/"
    author:
      "@id": "https://gomezaldaz.com/#person"
    about:
      "@id": "https://gomezaldaz.com/#person"
    mainEntityOfPage: "https://gomezaldaz.com/en/sentence/"
    inLanguage: en
  - "@context": "https://schema.org"
    "@type": Article
    "@id": "https://gomezaldaz.com/#court-decision"
    headline: "Court decision recognising dual filiation for an adopted person"
    description: "Final judicial ruling declaring the claimant’s biological filiation without annulling the prior adoption, thereby establishing a situation of dual filiation with full civil and registry effects. The decision was subsequently upheld in full by the Provincial Court of Navarra. By its content and scope, it constitutes a pioneering ruling at a global level and opens the way for other adopted persons to bring similar actions seeking recognition of dual filiation."
    url: "https://gomezaldaz.com/en/sentence/"
    author:
      "@id": "https://gomezaldaz.com/#person"
    about:
      - "@id": "https://gomezaldaz.com/#person"
      - "@id": "https://gomezaldaz.com/#legal-case"
    mainEntityOfPage: "https://gomezaldaz.com/en/sentence/"
    inLanguage: en''',
          }

          for rel, block in page_nodes.items():
              path = ROOT / rel
              if not path.exists():
                  raise AssertionError(f'Missing expected page: {rel}')
              _, front, body = split_front_matter(path)
              if 'schema_nodes:' in front or 'schema_publication:' in front:
                  raise AssertionError(f'Unexpected existing schema in {rel}')
              original_bodies[path] = body
              write_front(path, front.rstrip() + '\n' + block, body)

          # 3) Replace all page-specific layout conditionals with one generic reader.
          layout = LAYOUT.read_text(encoding='utf-8')
          original_layout = layout
          markers = [
              'PROFILE PAGE', 'WEBSITE AND HOME PAGE', 'PUBLICATION',
              'ORGANIZATION', 'LEGAL CASE', 'COURT DECISION'
          ]
          for marker in markers:
              if layout.count(f'--- {marker} ---') != 1:
                  raise AssertionError(f'Unexpected marker count for {marker}')

          generic = '''  {% comment %} --- PAGE-SPECIFIC SCHEMA NODES --- {% endcomment %}

  {% if page.schema_nodes %}
    {% for schema_node in page.schema_nodes %}
      {% capture custom_node %}
      ,
      {{ schema_node | jsonify }}
      {% endcapture %}

      {% assign schema_nodes = schema_nodes | append: custom_node %}
    {% endfor %}
  {% endif %}

'''

          pattern = re.compile(
              r'  \{% comment %\} --- PROFILE PAGE --- \{% endcomment %\}.*?'
              r'  \{% comment %\} --- COURT DECISION --- \{% endcomment %\}.*?'
              r'(?=  <script type="application/ld\+json">)',
              re.S,
          )
          layout, count = pattern.subn(generic, layout)
          if count != 1:
              raise AssertionError(f'Could not replace conditional schema area: {count}')
          LAYOUT.write_text(layout, encoding='utf-8')

          # 4) Validation.
          for path, old_body in original_bodies.items():
              _, front, body = split_front_matter(path)
              if body != old_body:
                  raise AssertionError(f'Visible body changed: {path}')
              if front.count('schema_nodes:') != 1:
                  raise AssertionError(f'Expected one schema_nodes block: {path}')

          all_text = '\n'.join(
              p.read_text(encoding='utf-8')
              for p in ROOT.rglob('*.html')
              if '.git' not in p.parts and '_site' not in p.parts
          )
          if 'schema_publication:' in all_text:
              raise AssertionError('schema_publication remains in HTML files')

          layout_check = LAYOUT.read_text(encoding='utf-8')
          forbidden = [
              'page.url == "/es/autor/"', 'page.url == "/en/author/"',
              'page.url == "/"', 'page.url contains "/genus-homo/"',
              'page.url contains "/demanda/"', 'page.url contains "/sentencia/"',
              'page.schema_publication'
          ]
          for token in forbidden:
              if token in layout_check:
                  raise AssertionError(f'Old conditional remains: {token}')
          if layout_check.count('page.schema_nodes') != 2:
              raise AssertionError('Generic schema_nodes reader is not present as expected')

          schema_pages = []
          for path in ROOT.rglob('*.html'):
              if '.git' in path.parts or '_site' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if text.startswith('---\n'):
                  _, front, _ = split_front_matter(path)
                  if 'schema_nodes:' in front:
                      schema_pages.append(path)
          if len(schema_pages) != 24:
              raise AssertionError(f'Expected 24 schema_nodes pages, found {len(schema_pages)}')

          # The workflow must not remain in the repository.
          WORKFLOW.unlink()
          print('Migrated publication pages:', len(publication_pages))
          print('Added conditional nodes to pages:', len(page_nodes))
          print('Total pages with schema_nodes:', len(schema_pages))
          PY

          git diff --check
          git status --short

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize page-specific schema in front matter"
          git push
