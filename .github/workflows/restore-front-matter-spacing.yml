name: Restore front matter spacing

on:
  push:
    paths:
      - '.github/workflows/restore-front-matter-spacing.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore consistent spacing and final dates
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'time'

          def source_path(url)
            return 'index.html' if url == '/'
            "#{url.sub(%r{\A/}, '')}index.html"
          end

          resources_path = '_data/resources.yml'
          resources = YAML.unsafe_load_file(resources_path).fetch('html')
          changed = []

          resources.each do |resource|
            path = source_path(resource.fetch('url'))
            text = File.read(path, encoding: 'UTF-8')
            updated = text.sub(/\A(---\n.*?\n---\n)(?!\n)/m, "\\1\n")
            if updated != text
              File.write(path, updated, mode: 'w', encoding: 'UTF-8')
              changed << path
            end
          end

          raise "Expected 34 spacing corrections, found #{changed.length}" unless changed.length == 34

          timestamp = Time.now.getlocal('+02:00').iso8601
          lines = File.readlines(resources_path, encoding: 'UTF-8')
          in_html = false
          updated_dates = 0
          lines.map! do |line|
            in_html = true if line.strip == 'html:'
            in_html = false if line.strip == 'pdf:'
            if in_html && line.lstrip.start_with?('- {url:')
              line = line.sub(/modified: "[^"]+"/, "modified: \"#{timestamp}\"")
              updated_dates += 1
            end
            line
          end
          raise "Expected 56 HTML dates, updated #{updated_dates}" unless updated_dates == 56
          File.write(resources_path, lines.join, mode: 'w', encoding: 'UTF-8')

          File.write('/tmp/spacing-paths.txt', changed.join("\n") + "\n")
          puts "Restored spacing in #{changed.length} files; final HTML timestamp #{timestamp}."
          RUBY

      - name: Validate source format and schema
        run: |
          ruby <<'RUBY'
          require 'yaml'

          WEBSITE_ID = 'https://gomezaldaz.com/#website'
          PAGE_TYPES = ['WebPage', 'ProfilePage', 'CollectionPage'].freeze

          def source_path(url)
            return 'index.html' if url == '/'
            "#{url.sub(%r{\A/}, '')}index.html"
          end

          resources = YAML.unsafe_load_file('_data/resources.yml').fetch('html')
          raise 'HTML timestamps are not uniform' unless resources.map { |item| item['modified'] }.uniq.length == 1

          resources.each do |resource|
            path = source_path(resource.fetch('url'))
            text = File.read(path, encoding: 'UTF-8')
            match = text.match(/\A---\n(.*?)\n---\n\n/m)
            raise "#{path}: missing single blank line after front matter" unless match
            data = YAML.unsafe_load(match[1]) || {}
            nodes = Array(data['schema_nodes'])
            pages = nodes.select { |node| node.is_a?(Hash) && PAGE_TYPES.include?(node['@type']) }
            raise "#{path}: expected one page node" unless pages.length == 1
            part = pages.first['isPartOf']
            raise "#{path}: missing WebSite relationship" unless part.is_a?(Hash) && part['@id'] == WEBSITE_ID
            raise "#{path}: inverse relationship remains" if nodes.any? { |node| node.is_a?(Hash) && node.key?('mainEntityOfPage') }
          end

          puts "Source format and schema validation passed for #{resources.length} pages."
          RUBY

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Build site
        run: jekyll build --trace

      - name: Validate all generated JSON-LD
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'json'

          WEBSITE_ID = 'https://gomezaldaz.com/#website'
          PAGE_TYPES = ['WebPage', 'ProfilePage', 'CollectionPage'].freeze

          def generated_path(url)
            return '_site/index.html' if url == '/'
            "_site/#{url.sub(%r{\A/}, '')}index.html"
          end

          resources = YAML.unsafe_load_file('_data/resources.yml').fetch('html')
          expected_modified = resources.first.fetch('modified')
          resources.each do |resource|
            path = generated_path(resource.fetch('url'))
            text = File.read(path, encoding: 'UTF-8')
            match = text.match(%r{<script type="application/ld\+json">\s*(\{.*?\})\s*</script>}m)
            raise "#{path}: JSON-LD missing" unless match
            graph = JSON.parse(match[1]).fetch('@graph')
            websites = graph.select { |node| node['@type'] == 'WebSite' && node['@id'] == WEBSITE_ID }
            pages = graph.select { |node| PAGE_TYPES.include?(node['@type']) }
            raise "#{path}: WebSite count #{websites.length}" unless websites.length == 1
            raise "#{path}: page count #{pages.length}" unless pages.length == 1
            raise "#{path}: wrong dateModified" unless pages.first['dateModified'] == expected_modified
            raise "#{path}: inverse remains" if graph.any? { |node| node.key?('mainEntityOfPage') }
          end
          puts "Generated JSON-LD validation passed for #{resources.length} pages."
          RUBY

      - name: Commit spacing correction and remove workflow
        run: |
          mapfile -t changed_paths < /tmp/spacing-paths.txt
          rm .github/workflows/restore-front-matter-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${changed_paths[@]}" _data/resources.yml .github/workflows/restore-front-matter-spacing.yml
          git commit -m 'Restore consistent front matter spacing'
          git push
