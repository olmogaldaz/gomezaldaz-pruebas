name: Add publication metadata to resilience and registry stigma

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-schema-resilience-stigma.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert schema_publication in page front matter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schemas = {
          "es/obra/testimonios/voy-a-hablar-de-resiliencia/index.html": '''schema_publication:
            "@context": "https://schema.org"
            "@type": Article
            "@id": "https://gomezaldaz.com/es/obra/testimonios/voy-a-hablar-de-resiliencia/#publication"
            url: "https://gomezaldaz.com/es/obra/testimonios/voy-a-hablar-de-resiliencia/"
            name: "Voy a hablar de resiliencia: Resiliencia frente a la adopción"
            headline: "Voy a hablar de resiliencia: Resiliencia frente a la adopción"
            description: "Página documental sobre el testimonio de Olmo Gómez Aldaz sobre resiliencia frente a la adopción, identidad de nacimiento, adopción fallida, doble filiación, bebés robados, memoria democrática y abolición de la adopción."
            abstract: >-
              Testimonio preparado para el panel abierto «Diferentes voces», celebrado el
              20 de junio de 2026 en el Ministerio de Juventud e Infancia. Aborda la resiliencia
              frente a la adopción desde la identidad de nacimiento, la doble filiación, los
              bebés robados, la memoria democrática y la abolición de la adopción.
            author:
              "@id": "https://gomezaldaz.com/#person"
            datePublished: "2026-06-20"
            version: "1.0"
            inLanguage: es
            identifier: "https://doi.org/10.5281/zenodo.20770383"
            keywords:
              - resiliencia frente a la adopción
              - adopción
              - identidad de nacimiento
              - doble filiación
              - bebés robados
              - memoria democrática
              - abolición de la adopción
              - testimonio
            mainEntityOfPage:
              "@type": WebPage
              "@id": "https://gomezaldaz.com/es/obra/testimonios/voy-a-hablar-de-resiliencia/#webpage"
            encoding:
              "@type": MediaObject
              contentUrl: "https://gomezaldaz.com/docs/voy-a-hablar-de-resiliencia-v1.pdf"
              encodingFormat: "application/pdf"
            workTranslation:
              "@id": "https://gomezaldaz.com/en/work/testimonies/i-am-going-to-speak-about-resilience/#publication"''',

          "en/work/testimonies/i-am-going-to-speak-about-resilience/index.html": '''schema_publication:
            "@context": "https://schema.org"
            "@type": Article
            "@id": "https://gomezaldaz.com/en/work/testimonies/i-am-going-to-speak-about-resilience/#publication"
            url: "https://gomezaldaz.com/en/work/testimonies/i-am-going-to-speak-about-resilience/"
            name: "I Am Going to Talk About Resilience: Resilience Against Adoption"
            headline: "I Am Going to Talk About Resilience: Resilience Against Adoption"
            description: "Documentary page on the testimony by Olmo Gómez Aldaz on resilience against adoption, birth identity, failed adoption, dual filiation, stolen babies, democratic memory and the abolition of adoption."
            abstract: >-
              English translation and adaptation of a testimony prepared for the open panel
              Different Voices. It addresses resilience against adoption through birth identity,
              dual filiation, stolen babies, democratic memory and the abolition of adoption.
            author:
              "@id": "https://gomezaldaz.com/#person"
            datePublished: "2026-06-23"
            version: "1.0"
            inLanguage: en
            identifier: "https://doi.org/10.5281/zenodo.20818226"
            keywords:
              - resilience against adoption
              - adoption
              - birth identity
              - dual filiation
              - stolen babies
              - democratic memory
              - abolition of adoption
              - testimony
            mainEntityOfPage:
              "@type": WebPage
              "@id": "https://gomezaldaz.com/en/work/testimonies/i-am-going-to-speak-about-resilience/#webpage"
            encoding:
              "@type": MediaObject
              contentUrl: "https://gomezaldaz.com/docs/I-am-going-to-talk-about-resilience-v1.pdf"
              encodingFormat: "application/pdf"
            translationOfWork:
              "@id": "https://gomezaldaz.com/es/obra/testimonios/voy-a-hablar-de-resiliencia/#publication"''',

          "es/obra/adopcion/estigma-registral-adopcion/index.html": '''schema_publication:
            "@context": "https://schema.org"
            "@type": ScholarlyArticle
            "@id": "https://gomezaldaz.com/es/obra/adopcion/estigma-registral-adopcion/#publication"
            url: "https://gomezaldaz.com/es/obra/adopcion/estigma-registral-adopcion/"
            name: "El estigma registral de la adopción: Cuando la supuesta protección se convierte en discriminación"
            headline: "El estigma registral de la adopción: Cuando la supuesta protección se convierte en discriminación"
            description: "Página documental sobre El estigma registral de la adopción, texto de Olmo Gómez Aldaz que analiza cómo la publicidad restringida de la filiación adoptiva convierte una supuesta protección en discriminación."
            abstract: >-
              Análisis jurídico y crítico del tratamiento registral excepcional de la filiación
              adoptiva en España. Examina cómo la publicidad restringida, presentada como
              protección de la intimidad, puede convertirse en discriminación y estigma impuesto
              por el Estado a las personas adoptadas.
            author:
              "@id": "https://gomezaldaz.com/#person"
            datePublished: "2026-05-13"
            version: "1.0"
            inLanguage: es
            identifier: "https://doi.org/10.5281/zenodo.20159685"
            keywords:
              - estigma registral
              - adopción
              - Registro Civil
              - filiación adoptiva
              - discriminación
              - identidad
              - derechos de las personas adoptadas
              - memoria democrática
            mainEntityOfPage:
              "@type": WebPage
              "@id": "https://gomezaldaz.com/es/obra/adopcion/estigma-registral-adopcion/#webpage"
            encoding:
              "@type": MediaObject
              contentUrl: "https://gomezaldaz.com/docs/el-estigma-registral-de-la-adopcion-v1.pdf"
              encodingFormat: "application/pdf"
            workTranslation:
              "@id": "https://gomezaldaz.com/en/work/adoption/registry-stigma-of-adoption/#publication"''',

          "en/work/adoption/registry-stigma-of-adoption/index.html": '''schema_publication:
            "@context": "https://schema.org"
            "@type": ScholarlyArticle
            "@id": "https://gomezaldaz.com/en/work/adoption/registry-stigma-of-adoption/#publication"
            url: "https://gomezaldaz.com/en/work/adoption/registry-stigma-of-adoption/"
            name: "The Registry Stigma of Adoption: When Supposed Protection Becomes Discrimination"
            headline: "The Registry Stigma of Adoption: When Supposed Protection Becomes Discrimination"
            description: "Documentary page on The Registry Stigma of Adoption, a text by Olmo Gómez Aldaz analysing how restricted publicity of adoptive filiation turns supposed protection into discrimination."
            abstract: >-
              Legal and critical analysis of the exceptional registry treatment of adoptive
              filiation in Spain. It examines how restricted access, presented as privacy
              protection, can become discrimination and a registry stigma imposed by the State
              on adopted people.
            author:
              "@id": "https://gomezaldaz.com/#person"
            datePublished: "2026-06-23"
            version: "1.0"
            inLanguage: en
            identifier: "https://doi.org/10.5281/zenodo.20820051"
            keywords:
              - registry stigma
              - adoption
              - Civil Registry
              - adoptive filiation
              - discrimination
              - identity
              - adoptee rights
              - democratic memory
            mainEntityOfPage:
              "@type": WebPage
              "@id": "https://gomezaldaz.com/en/work/adoption/registry-stigma-of-adoption/#webpage"
            encoding:
              "@type": MediaObject
              contentUrl: "https://gomezaldaz.com/docs/the-registry-stigma-of-adoption-v1.pdf"
              encodingFormat: "application/pdf"
            translationOfWork:
              "@id": "https://gomezaldaz.com/es/obra/adopcion/estigma-registral-adopcion/#publication"'''
          }

          for filename, block in schemas.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise SystemExit(f"Invalid front matter start: {filename}")
              if "schema_publication:" in text.split("---", 2)[1]:
                  raise SystemExit(f"schema_publication already present: {filename}")
              closing = text.find("\n---\n", 4)
              if closing == -1:
                  raise SystemExit(f"Front matter closing marker not found: {filename}")
              body_before = text[closing + 5:]
              updated = text[:closing] + "\n" + block + text[closing:]
              path.write_text(updated, encoding="utf-8")
              check = path.read_text(encoding="utf-8")
              if check.count("schema_publication:") != 1:
                  raise SystemExit(f"Unexpected schema count: {filename}")
              if check[check.find("\n---\n", 4) + 5:] != body_before:
                  raise SystemExit(f"Visible body changed: {filename}")
          PY

      - name: Commit pages and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/add-schema-resilience-stigma.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/obra/testimonios/voy-a-hablar-de-resiliencia/index.html \
                  en/work/testimonies/i-am-going-to-speak-about-resilience/index.html \
                  es/obra/adopcion/estigma-registral-adopcion/index.html \
                  en/work/adoption/registry-stigma-of-adoption/index.html \
                  .github/workflows/add-schema-resilience-stigma.yml
          git commit -m "Add publication metadata to resilience and registry stigma"
          git push
