name: Add schema to six pending pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: gem install jekyll --no-document
      - name: Add schema nodes
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'

          pages = {
            'es/obra/adopcion/adopcion-genocidio-identicida-colonial/index.html' => {
              'url' => '/es/obra/adopcion/adopcion-genocidio-identicida-colonial/',
              'lang' => 'es',
              'entity_type' => 'ScholarlyArticle',
              'entity_suffix' => 'article',
              'entity_name' => 'La adopción como genocidio identicida colonial',
              'entity_description' => 'Texto de Olmo Gómez Aldaz que analiza la adopción moderna como dispositivo colonial de borrado de origen, alienación y adoctrinamiento.',
              'identifier' => 'https://doi.org/10.5281/zenodo.17590565',
              'keywords' => ['adopción', 'identicidio', 'colonialidad', 'filiación de origen', 'genealogía', 'biopolítica']
            },
            'en/work/adoption/adoption-as-colonial-identicide-genocide/index.html' => {
              'url' => '/en/work/adoption/adoption-as-colonial-identicide-genocide/',
              'lang' => 'en',
              'entity_type' => 'ScholarlyArticle',
              'entity_suffix' => 'article',
              'entity_name' => 'Adoption as colonial identicide genocide',
              'entity_description' => 'Text by Olmo Gómez Aldaz analysing modern adoption as a colonial device of origin erasure, alienation and indoctrination.',
              'identifier' => 'https://doi.org/10.5281/zenodo.17590564',
              'keywords' => ['adoption', 'identicide', 'coloniality', 'filiation of origin', 'genealogy', 'biopolitics']
            },
            'en/work/stolen-babies/maria-madre-association-report/index.html' => {
              'url' => '/en/work/stolen-babies/maria-madre-association-report/',
              'lang' => 'en',
              'entity_type' => 'Report',
              'entity_suffix' => 'publication',
              'entity_name' => 'IAMM – Report on the Maria Madre Association of Bilbao',
              'entity_description' => 'Documentary and historical report on the Maria Madre Association of Bilbao and its links with irregular adoptions, stolen babies, concealment of filiations and identity substitution in Spain.',
              'identifier' => 'https://doi.org/10.5281/zenodo.17352586',
              'version' => '1.1',
              'encoding' => '/docs/iamm-informe-asociacion-maria-madre-v1.1.pdf',
              'keywords' => ['Maria Madre Association of Bilbao', 'stolen babies', 'irregular adoptions', 'Francoism', 'filiation', 'identity substitution']
            },
            'en/work/stolen-babies/adoptados-bilbao-report/index.html' => {
              'url' => '/en/work/stolen-babies/adoptados-bilbao-report/',
              'lang' => 'en',
              'entity_type' => 'Report',
              'entity_suffix' => 'publication',
              'entity_name' => 'REPORT ON THE BLOG AdoptadosBilbao.Blogspot.com',
              'entity_description' => 'Documentary report on AdoptadosBilbao.Blogspot.com as a historical digital archive of victims and relatives searching for origins and denouncing illegal adoptions and stolen babies.',
              'identifier' => 'https://doi.org/10.5281/zenodo.17363915',
              'version' => '1.1',
              'encoding' => '/docs/informe-adoptadosbilbao-blogspot-2025-v1.1.pdf',
              'keywords' => ['AdoptadosBilbao', 'stolen babies', 'illegal adoptions', 'search for origins', 'digital memory', 'democratic memory']
            },
            'es/prensa/el-observatorio-9-2026/index.html' => {
              'url' => '/es/prensa/el-observatorio-9-2026/',
              'lang' => 'es',
              'entity_type' => 'Article',
              'entity_suffix' => 'article',
              'entity_name' => 'La batalla por mi identidad',
              'entity_description' => 'Entrevista a Olmo Gómez Aldaz publicada en El Observatorio nº 9 sobre su búsqueda de origen, la sustracción de identidad, la adopción fraudulenta y la restitución judicial de su filiación de origen.',
              'date_published' => '2026-06',
              'is_part_of' => 'El Observatorio nº 9',
              'encoding' => '/docs/el-observatorio-9-2026.pdf',
              'keywords' => ['Olmo Gómez Aldaz', 'identidad', 'filiación de origen', 'bebés robados', 'adopción fraudulenta']
            },
            'en/press/el-observatorio-9-2026/index.html' => {
              'url' => '/en/press/el-observatorio-9-2026/',
              'lang' => 'en',
              'entity_type' => 'Article',
              'entity_suffix' => 'article',
              'entity_name' => 'The battle for my identity',
              'entity_description' => 'Interview with Olmo Gómez Aldaz published in El Observatorio no. 9 about his search for origins, identity theft, fraudulent adoption and the judicial restitution of his filiation of origin.',
              'date_published' => '2026-06',
              'is_part_of' => 'El Observatorio no. 9',
              'encoding' => '/docs/el-observatorio-9-2026.pdf',
              'keywords' => ['Olmo Gómez Aldaz', 'identity', 'filiation of origin', 'stolen babies', 'fraudulent adoption']
            }
          }

          pages.each do |path, config|
            text = File.read(path)
            match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m) or abort "Front matter no encontrado: #{path}"
            data = YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true) || {}
            abort "schema_nodes ya existe: #{path}" if data['schema_nodes']

            canonical = "https://gomezaldaz.com#{config['url']}"
            webpage_id = "#{canonical}#webpage"
            entity_id = "#{canonical}##{config['entity_suffix']}"

            webpage = {
              '@type' => 'WebPage',
              '@id' => webpage_id,
              'url' => canonical,
              'name' => data['title'],
              'description' => data['description'],
              'inLanguage' => config['lang'],
              'mainEntity' => { '@id' => entity_id }
            }

            entity = {
              '@type' => config['entity_type'],
              '@id' => entity_id,
              'url' => canonical,
              'name' => config['entity_name'],
              'headline' => config['entity_name'],
              'description' => config['entity_description'],
              'author' => { '@id' => 'https://gomezaldaz.com/#person' },
              'inLanguage' => config['lang'],
              'mainEntityOfPage' => { '@id' => webpage_id },
              'identifier' => config['identifier'],
              'version' => config['version'],
              'datePublished' => config['date_published'],
              'keywords' => config['keywords']
            }
            entity['isPartOf'] = { '@type' => 'Periodical', 'name' => config['is_part_of'] } if config['is_part_of']
            if config['encoding']
              entity['encoding'] = {
                '@type' => 'MediaObject',
                'contentUrl' => "https://gomezaldaz.com#{config['encoding']}",
                'encodingFormat' => 'application/pdf'
              }
            end
            entity.delete_if { |_key, value| value.nil? }

            data['schema_nodes'] = [webpage, entity]
            data['schema_date_target'] = webpage_id

            body = text[match.end(0)..] || ''
            yaml = YAML.dump(data, line_width: -1).sub(/\A---\s*\n/, '')
            File.write(path, "---\n#{yaml}---\n\n#{body.sub(/\A\n*/, '')}")
          end
          RUBY
      - name: Verify scope and visible content
        run: |
          ruby <<'RUBY'
          expected = %w[
            es/obra/adopcion/adopcion-genocidio-identicida-colonial/index.html
            en/work/adoption/adoption-as-colonial-identicide-genocide/index.html
            en/work/stolen-babies/maria-madre-association-report/index.html
            en/work/stolen-babies/adoptados-bilbao-report/index.html
            es/prensa/el-observatorio-9-2026/index.html
            en/press/el-observatorio-9-2026/index.html
          ].sort
          changed = `git diff --name-only -- '**/index.html'`.lines.map(&:strip).reject(&:empty?).sort
          abort "Ámbito incorrecto: #{changed.inspect}" unless changed == expected
          expected.each do |path|
            current = File.read(path).sub(/\A---\s*\n.*?\n---\s*\n/m, '')
            previous = `git show HEAD:#{path}`.sub(/\A---\s*\n.*?\n---\s*\n/m, '')
            abort "Cambió el cuerpo visible: #{path}" unless current == previous
          end
          RUBY
      - name: Build and validate JSON-LD
        run: |
          jekyll build --trace
          ruby <<'RUBY'
          require 'yaml'
          require 'json'
          require 'date'
          paths = %w[
            es/obra/adopcion/adopcion-genocidio-identicida-colonial/index.html
            en/work/adoption/adoption-as-colonial-identicide-genocide/index.html
            en/work/stolen-babies/maria-madre-association-report/index.html
            en/work/stolen-babies/adoptados-bilbao-report/index.html
            es/prensa/el-observatorio-9-2026/index.html
            en/press/el-observatorio-9-2026/index.html
          ]
          errors = []
          paths.each do |path|
            fm = File.read(path).match(/\A---\s*\n(.*?)\n---\s*\n/m)
            data = YAML.safe_load(fm[1], permitted_classes: [Date, Time], aliases: true)
            url = data['schema_nodes'].first['url']
            relative = url.sub('https://gomezaldaz.com/', '')
            output = File.join('_site', relative, 'index.html')
            script = File.read(output).match(/<script type="application\/ld\+json">(.*?)<\/script>/m)&.[](1)
            begin
              graph = JSON.parse(script).fetch('@graph')
            rescue => e
              errors << "JSON-LD inválido en #{path}: #{e.message}"
              next
            end
            webpage = graph.find { |node| node.is_a?(Hash) && node['@id'] == data['schema_date_target'] }
            entity_id = webpage&.dig('mainEntity', '@id')
            entity = graph.find { |node| node.is_a?(Hash) && node['@id'] == entity_id }
            errors << "WebPage incorrecto en #{path}" unless webpage && webpage['@type'] == 'WebPage'
            errors << "Relación inversa incorrecta en #{path}" unless entity&.dig('mainEntityOfPage', '@id') == data['schema_date_target']
          end
          errors.each { |error| puts error }
          exit 1 unless errors.empty?
          RUBY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-six-schema-pages.yml
          git add -- ':(glob)**/index.html'
          git commit -m 'Add schema to six pending content pages'
          git push origin HEAD:main
