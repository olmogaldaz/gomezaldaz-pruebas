name: Validar centralización temporal

on:
  push:
    branches:
      - centralizar-menu-wrap

permissions:
  contents: write

jobs:
  validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralizar-menu-wrap

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Instalar Jekyll
        run: gem install jekyll -v 4.3.4

      - name: Construir sitio
        run: jekyll build --trace

      - name: Validar HTML generado
        shell: python
        run: |
          from pathlib import Path
          import re

          html_files = list(Path('_site').rglob('*.html'))
          if not html_files:
              raise RuntimeError('Jekyll no generó archivos HTML')

          normal_pages = 0
          errors = []

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              headers = len(re.findall(r'<header\s+id="site-header"', text))
              wraps_top = len(re.findall(r'<div\s+class="wrap"\s+id="top"', text))

              # Las dos redirecciones históricas pueden no tener contenido principal.
              redirect = ('http-equiv="refresh"' in text.lower())

              if not redirect:
                  normal_pages += 1
                  mains = len(re.findall(r'<main(?:\s|>)', text))
                  if headers != 1:
                      errors.append(f'{path}: headers={headers}')
                  if wraps_top != 1:
                      errors.append(f'{path}: wraps_top={wraps_top}')
                  if mains != 1:
                      errors.append(f'{path}: mains={mains}')

              if 'header.innerHTML' in text or 'const navES' in text or 'const navEN' in text:
                  errors.append(f'{path}: conserva generación JS del menú')

          menu_js = Path('_site/js/menu.js').read_text(encoding='utf-8')
          for forbidden in ('header.innerHTML', 'const navES', 'const navEN'):
              if forbidden in menu_js:
                  errors.append(f'js/menu.js conserva {forbidden}')

          es_home = Path('_site/index.html').read_text(encoding='utf-8')
          en_home = Path('_site/en/index.html').read_text(encoding='utf-8')
          checks = [
              ('Inicio', es_home), ('/es/autor/', es_home), ('/en/', es_home),
              ('Home', en_home), ('/en/author/', en_home), ('href="/"', en_home),
              ('· PRUEBAS', es_home), ('· PRUEBAS', en_home),
          ]
          for needle, haystack in checks:
              if needle not in haystack:
                  errors.append(f'No aparece {needle!r} donde corresponde')

          if errors:
              raise RuntimeError('\n'.join(errors))

          print(f'Validación correcta: {len(html_files)} HTML generados; {normal_pages} páginas normales comprobadas.')

      - name: Eliminar flujo temporal
        run: |
          rm .github/workflows/validar-centralizacion-temporal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retirar validación temporal"
          git push origin centralizar-menu-wrap
