name: Link scope sources

# One-time workflow for the test repository.
on:
  push:
    paths:
      - '.github/workflows/link-scope-sources.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link El Correo and 28 July sources
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            Path('es/memoria/index.html'): (
              '''      <p>
        <em>El Correo</em> informó el 15 de julio de 2026 de que era la primera vez que Euskadi concedía un reconocimiento de estas características. Olmo Gómez Aldaz era, por tanto, la primera y única persona reconocida por Gogora mediante la categoría concreta del artículo 4.2.l.
      </p>

      <p>
        El 28 de julio de 2026, la Dirección General de Atención a las Víctimas confirmó mediante una resolución de acceso a la información pública que la declaración estatal era también la única concedida a una persona sustraída, separada o entregada al nacer sin el consentimiento libre y legítimo de sus progenitores.
      </p>

      <p>
        <a href="/es/prensa/el-correo-primer-bebe-robado-victima-franquismo/">Consultar la cobertura y documentación de <em>El Correo</em></a>
      </p>''',
              '''      <p>
        <a href="/es/prensa/el-correo-primer-bebe-robado-victima-franquismo/"><em>El Correo</em> informó el 15 de julio de 2026 de que era la primera vez que Euskadi concedía un reconocimiento de estas características.</a> Olmo Gómez Aldaz era, por tanto, la primera y única persona reconocida por Gogora mediante la categoría concreta del artículo 4.2.l.
      </p>

      <p>
        <a href="/docs/resolucion-acceso-informacion-unica-declaracion-reconocimiento-olmo-2026.pdf" target="_blank" rel="noopener noreferrer">El 28 de julio de 2026, la Dirección General de Atención a las Víctimas confirmó mediante una resolución de acceso a la información pública que la declaración estatal era también la única concedida a una persona sustraída, separada o entregada al nacer sin el consentimiento libre y legítimo de sus progenitores.</a>
      </p>'''
            ),
            Path('en/memory/index.html'): (
              '''      <p>
        <em>El Correo</em> reported on 15 July 2026 that this was the first time the Basque Country had granted a recognition of this kind. Olmo Gómez Aldaz was therefore the first and only person recognised by Gogora under the specific category in Article 4.2.l.
      </p>

      <p>
        On 28 July 2026, the Directorate-General for Victim Support also confirmed, through a public-information access decision, that the state declaration was the only one granted to a person removed, separated or handed over at birth without the free and legitimate consent of their parents.
      </p>

      <p>
        <a href="/en/press/el-correo-first-stolen-baby-recognised-francoism-victim/">View the <em>El Correo</em> coverage and documentary page</a>
      </p>''',
              '''      <p>
        <a href="/en/press/el-correo-first-stolen-baby-recognised-francoism-victim/"><em>El Correo</em> reported on 15 July 2026 that this was the first time the Basque Country had granted a recognition of this kind.</a> Olmo Gómez Aldaz was therefore the first and only person recognised by Gogora under the specific category in Article 4.2.l.
      </p>

      <p>
        <a href="/docs/resolucion-acceso-informacion-unica-declaracion-reconocimiento-olmo-2026.pdf" target="_blank" rel="noopener noreferrer">On 28 July 2026, the Directorate-General for Victim Support also confirmed, through a public-information access decision, that the state declaration was the only one granted to a person removed, separated or handed over at birth without the free and legitimate consent of their parents.</a>
      </p>'''
            )
          }

          changed = []
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              changed.append(str(path))

          if changed:
              import subprocess
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add',*changed], check=True)
              subprocess.run(['git','commit','-m','Vincular las fuentes del alcance pionero'], check=True)
              subprocess.run(['git','push'], check=True)
