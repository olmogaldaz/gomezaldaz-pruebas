name: Restore book publication dates

on:
  push:
    paths:
      - '.github/workflows/restore-book-publication-dates.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: gem install jekyll --no-document
      - name: Restore historical Book dates
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'

          dates = {
            'es/obra/libros/index.html' => '2026-01',
            'en/work/books/index.html' => '2026-02'
          }

          dates.each do |path, published|
            text = File.read(path)
            match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m)
            abort "No front matter: #{path}" unless match
            data = YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true) || {}
            body = text[match.end(0)..] || ''
            nodes = data.fetch('schema_nodes')
            book = nodes.find { |node| node.is_a?(Hash) && node['@type'] == 'Book' && node['@id']&.end_with?('#publication') }
            abort "Book not found: #{path}" unless book
            book['datePublished'] = published
            yaml = YAML.dump(data, line_width: -1).sub(/\A---\s*\n/, '')
            File.write(path, "---\n#{yaml}---\n\n#{body.sub(/\A\n*/, '')}")
          end
          RUBY
      - name: Verify and build
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'
          expected = {
            'es/obra/libros/index.html' => '2026-01',
            'en/work/books/index.html' => '2026-02'
          }
          expected.each do |path, date|
            text = File.read(path)
            match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m)
            data = YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true)
            book = data['schema_nodes'].find { |node| node['@type'] == 'Book' }
            page = data['schema_nodes'].find { |node| node['@type'] == 'WebPage' }
            abort "Wrong Book date: #{path}" unless book['datePublished'] == date
            abort "Wrong date target: #{path}" unless data['schema_date_target'] == page['@id']
          end
          RUBY
          jekyll build --trace
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/restore-book-publication-dates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add es/obra/libros/index.html en/work/books/index.html .github/workflows/restore-book-publication-dates.yml
          git commit -m 'Restore historical publication dates to Book schema'
          git push
