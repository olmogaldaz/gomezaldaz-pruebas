name: Schema batch review
on:
  push:
    branches: [schema-review-batch]
    paths:
      - tools/schema_batch.py
      - .github/workflows/schema-batch.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-review-batch
      - name: Apply and validate agreed Schema updates
        run: python tools/schema_batch.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/resources.yml index.html en es
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Complete page-level Schema review"
            git push origin HEAD:schema-review-batch
          fi
