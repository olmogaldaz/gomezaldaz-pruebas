name: One-time schema description fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-schema-descriptions.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_schema_descriptions.py
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use literal descriptions in page schema"
          git push
