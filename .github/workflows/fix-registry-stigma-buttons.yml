name: One-time registry stigma button fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-registry-stigma-buttons.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize bilingual buttons
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          pages = [
              Path('es/obra/adopcion/estigma-registral-adopcion/index.html'),
              Path('en/work/adoption/registry-stigma-of-adoption/index.html'),
          ]

          es_old = '''      <div class="cta-row">
        <a class="cta" href="https://doi.org/10.5281/zenodo.20159685" target="_blank" rel="noopener noreferrer">Publicación española en Zenodo</a>
        <a class="cta" href="/docs/el-estigma-registral-de-la-adopcion-v1.pdf" target="_blank" rel="noopener noreferrer">PDF español</a>
        <a class="cta" href="https://doi.org/10.5281/zenodo.20820051" target="_blank" rel="noopener noreferrer">Publicación inglesa en Zenodo</a>
        <a class="cta" href="/docs/the-registry-stigma-of-adoption-v1.pdf" target="_blank" rel="noopener noreferrer">PDF inglés</a>
      </div>'''

          es_new = '''      <div class="cta-row">
        <a class="cta" href="https://doi.org/10.5281/zenodo.20159685" target="_blank" rel="noopener noreferrer">Versión española en Zenodo</a>
        <a class="cta" href="/docs/el-estigma-registral-de-la-adopcion-v1.pdf" target="_blank" rel="noopener noreferrer">Descargar PDF español</a>
      </div>

      <div class="cta-row">
        <a class="cta" href="https://doi.org/10.5281/zenodo.20820051" target="_blank" rel="noopener noreferrer">Versión inglesa en Zenodo</a>
        <a class="cta" href="/docs/the-registry-stigma-of-adoption-v1.pdf" target="_blank" rel="noopener noreferrer">Descargar PDF inglés</a>
      </div>'''

          en_old = '''      <div class="cta-row">
        <a class="cta" href="https://doi.org/10.5281/zenodo.20820051" target="_blank" rel="noopener noreferrer">Publication on Zenodo</a>
        <a class="cta" href="/docs/the-registry-stigma-of-adoption-v1.pdf" target="_blank" rel="noopener noreferrer">Local PDF</a>
      </div>'''

          en_new = '''      <div class="cta-row">
        <a class="cta" href="https://doi.org/10.5281/zenodo.20820051" target="_blank" rel="noopener noreferrer">English version on Zenodo</a>
        <a class="cta" href="/docs/the-registry-stigma-of-adoption-v1.pdf" target="_blank" rel="noopener noreferrer">Download English PDF</a>
      </div>

      <div class="cta-row">
        <a class="cta" href="https://doi.org/10.5281/zenodo.20159685" target="_blank" rel="noopener noreferrer">Spanish version on Zenodo</a>
        <a class="cta" href="/docs/el-estigma-registral-de-la-adopcion-v1.pdf" target="_blank" rel="noopener noreferrer">Download Spanish PDF</a>
      </div>'''

          es = pages[0].read_text(encoding='utf-8')
          en = pages[1].read_text(encoding='utf-8')

          if es.count(es_old) != 2:
              raise AssertionError(f'Expected 2 Spanish button blocks, found {es.count(es_old)}')
          if en.count(en_old) != 2:
              raise AssertionError(f'Expected 2 English button blocks, found {en.count(en_old)}')

          es = es.replace(es_old, es_new)
          en = en.replace(en_old, en_new)

          pages[0].write_text(es, encoding='utf-8')
          pages[1].write_text(en, encoding='utf-8')

          assert es.count('/docs/the-registry-stigma-of-adoption-v1.pdf') == 2
          assert en.count('/docs/the-registry-stigma-of-adoption-v1.pdf') == 2
          assert es.count('/docs/el-estigma-registral-de-la-adopcion-v1.pdf') == 2
          assert en.count('/docs/el-estigma-registral-de-la-adopcion-v1.pdf') == 2

          Path('.github/workflows/fix-registry-stigma-buttons.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/obra/adopcion/estigma-registral-adopcion/index.html \
                  en/work/adoption/registry-stigma-of-adoption/index.html \
                  .github/workflows/fix-registry-stigma-buttons.yml
          git diff --cached --check
          git commit -m "Normalize registry stigma bilingual buttons"
          git push
